name: Docker Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.gpu'
      - '.github/workflows/*'
      - 'deps/*'
      - 'keys/*'
      - 'scripts/*'

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/docker-android

jobs:

  # Builds all Android API images with supported levels from API 28 through 36.
  build-apis:
    strategy:
      matrix:
        version: [36, 35, 34, 33, 32, 31, 30, 29, 28]
        image: [
          { name: 'google_apis', suffix: '' },
          { name: 'google_apis_playstore', suffix: '-playstore' }
        ]
        gpu: [
          { file: 'Dockerfile', suffix: '' },
          { file: 'Dockerfile.gpu', suffix: '-cuda' }
        ]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build Docker image api-${{ matrix.version }}${{ matrix.image.suffix }}
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          file: ${{ matrix.gpu.file }}
          tags: ${{ env.DOCKER_IMAGE }}:api-${{ matrix.version }}${{ matrix.image.suffix }}${{ matrix.gpu.suffix }}
          cache-from: type=gha,scope=api-${{ matrix.version }}${{ matrix.image.suffix }}${{ matrix.gpu.suffix }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.version }}${{ matrix.image.suffix }}${{ matrix.gpu.suffix }}
          build-args: |
            API_LEVEL=${{ matrix.version }}
            IMG_TYPE=${{ matrix.image.name }}

  # Builds a minimal image without any Android SDK images.
  build-minimal:
    strategy:
      matrix:
        gpu: [
          { file: 'Dockerfile', suffix: '' },
          { file: 'Dockerfile.gpu', suffix: '-cuda' }
        ]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build minimal Docker image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          file: ${{ matrix.gpu.file }}
          tags: ${{ env.DOCKER_IMAGE }}:minimal${{ matrix.gpu.suffix }}
          cache-from: type=gha,scope=minimal${{ matrix.gpu.suffix }}
          cache-to: type=gha,mode=max,scope=minimal${{ matrix.gpu.suffix }}
          build-args: INSTALL_ANDROID_SDK=0
